spring.application.name=consumer
server.port=8082
# ---------- ActiveMQ (publisher jaisi hi) ----------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

# Queue ka naam: PUBLISHER KE SAATH EXACT SAME hona chahiye, warna dono alag letter-box dekhenge.
audit.queue-name=audit.events

# ---------- H2 database (file mode) ----------
# jdbc:h2:file:... = data ./data/auditdb.mv.db file mein save hota hai, to app restart par bhi rows bachi rehti hain.
# Alternate: jdbc:h2:mem:auditdb (restart par sab ud jaata hai, sirf quick test ke liye).
spring.datasource.url=jdbc:h2:file:./data/auditdb
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate entity dekhke table apne aap banata/badalta hai (audit_event table yahin banegi).
# Dev ke liye theek hai. PRODUCTION mein "validate" rakhte hain aur schema Flyway/Liquibase se manage karte hain,
# kyunki "update" kabhi-kabhi unexpected ALTER karta hai aur column kabhi drop nahi karta.
spring.jpa.hibernate.ddl-auto=update

# Console mein SQL print hoga, debugging ke liye. Prod mein off rakhte hain (log noise + performance).
spring.jpa.show-sql=true

# Browser mein DB dekhne ke liye: http://localhost:8082/h2-console
spring.h2.console.enabled=true