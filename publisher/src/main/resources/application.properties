
# ---------- App identity ----------
# Application ka naam. Logs, metrics aur broker console mein pehchaan ke kaam aata hai.
# Ye koi DB table/column nahi banata, sirf metadata hai.
spring.application.name=demo

# Is app ka HTTP port. Default 8080 hota hai, par consumer bhi Spring Boot hai,
# to dono ek hi laptop par chalenge. Isliye publisher 8081 aur consumer 8082 rakha hai,
# warna "Port already in use" error aata hai.
# Production mein container ke andar aksar 8080 hi rehta hai aur port mapping bahar hoti hai.
server.port=8081

# ---------- ActiveMQ connection ----------
# Broker ka address. tcp:// = OpenWire protocol, ActiveMQ Classic ka default port 61616.
# Alternate: vm://localhost?broker.persistent=false (embedded in-memory broker, kuch install nahi karna padta, par message app band hote hi ud jaate hain).
# Production mein failover use hota hai: failover:(tcp://mq1:61616,tcp://mq2:61616)
# taaki ek broker girne par publisher apne aap dusre par chala jaaye.
spring.activemq.broker-url=tcp://localhost:61616

# Broker ke default dev credentials (admin/admin).
# Production mein kabhi hardcode mat karo. Env variable se lo: spring.activemq.user=${AMQ_USER}
# ya Vault/Secrets Manager se.
spring.activemq.user=admin
spring.activemq.password=admin

# ---------- Custom (hamari apni) properties ----------
# Queue ka naam code mein hardcode karne ki jagah property mein rakha hai.
# Fayda: profile ke hisaab se queue badal sakti hai (dev: audit.events.dev, prod: audit.events)
# bina code change ke. @Value("${audit.queue-name}") se AuditPublisher ye read karta hai.
# Ye property sirf queue ka naam hai, broker mein queue pehle message par apne aap ban jaati hai.
audit.queue-name=audit.events